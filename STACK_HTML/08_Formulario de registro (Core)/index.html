<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>Crear una cuenta en Discord</h1>
    <form action="#" method="POST">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido">
        </div>
        <br>
        <div>
        <label for="correo">Correo electrónico:</label>
            <input type="text" id="correo" name="correo">
        </div>
        <br>
        <div>
            <label for="clave">Contraseña:</label>
            <input type="password" id="clave" name="clave">
        </div>
        <br>
        <div>
            <label for="clave">Confirmar contraseña:</label>
            <input type="password" id="confirmar_clave" name="confirmar_clave">
        </div>
        <br>
        <div>
            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha">
        </div>
        <br>    
        <div>
            <label>Género:</label>
            <input type="radio" id="masculino" name="masculino" value="normal">
            <label for="masculino">Másculino</label>
            <input type="radio" id="femenino" name="femenino" value="normal">
            <label for="femenino">Femenino</label>
            <input type="radio" id="prefiero_no_decirlo" name="prefiero_no_decirlo" value="normal">
            <label for="prefiero_no_decirlo">Prefiero no decirlo</label>
        </div>
        <br>
        <div>
            <label for="descripcion_sobre_ti">Descripción sobre ti:</label><br>
            <textarea id="descripcion_sobre_ti" name="descripcion_sobre_ti" rows="4" cols="30"></textarea>
        </div>
        <br>
        <div>
            <label for="selecciona_tus_intereses">Selecciona tus intereses:</label><br>
            <select id="selecciona_tus_intereses" name="selecciona_tus_intereses">
                <option value="Música">Música</option>
                <option value="Películas">Películas</option>
                <option value="Deportes">Deportes</option>
                <option value="Tecnología">Tecnología</option>
            </select><br>
        </div>
        <br>
        <div>
            <input type="checkbox" id="acepto" name="acepto">
            <label for="acepto">Al registrarte, aceptas los <a href="https://support.discord.com/hc/es/sections/115000344951-Pol%C3%ADticas-y-T%C3%A9rminos">Terminos y condiciones</a> de Discord.</label>
        </div>
        <br>
        <div>
            <input type="submit" value="Registrarse">
        </div>
    </form>

    </body>
</html>
