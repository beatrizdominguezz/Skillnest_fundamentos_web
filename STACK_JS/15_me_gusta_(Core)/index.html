<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Beatriz Dominguez">
    <title>Me gusta</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <header class="navbar">
        <h1>Social Like</h1>
    </header>

    <div class="contenedor">
        <aside class="perfil_targeta">
            <img src="static/images/misato.jpg" alt="Misato" class="foto_perfil">
            <h2>Misato</h2>
            <button class="boton_perfil">Mi perfil</button>
        </aside>

        <main class="publicaciones_muro">
            <h2>Últimas publicaciones</h2>

            <article class="publicacion">
                <div class="publicacion_encabezado">
                    <h3>Rei</h3>
                    <div class="contenedor">
                        <span id="contar_1">0</span> like(s)
                        <button id="boton_1" class="boton_me_gusta">Like</button>
                    </div>
                </div>
                <p class="publicacion_contenido">
                    Acabo de configurar este nuevo <a href="#">bot de Discrod</a>, cuéntame que opinan ustedes.
                </p>
            </article>

            <article class="publicacion">
                <div class="encabezado_publicacion">
                    <h3>Asuka</h3>
                    <div class="contenedor">
                        <span id="contar_2">0</span> like(s)
                        <button id="boton_2" class="boton_me_gusta">Like</button>
                    </div>
                </div>
                <p class="publicacion_contenido">
                    Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.
                </p>
            </article>

            <article class="publicacion">
                <div class="encabezado_publicacion">
                    <h3>Shinji</h3>
                    <div class="contenedor">
                        <span id="contar_3">0</span> like(s)
                        <button id="boton_3" class="boton_me_gusta">Like</button>
                    </div>
                </div>
                <p class="publicacion_contenido">
                    No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?
                </p>
            </article>
        </main>
    </div>

    <script src="static/js/script.js"></script>
</body>

</html>
