<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Fizz Buzz</title>
    <meta name="author" content="Beatriz Dominguez">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Desafío de Bucles</h1>

        <div class="card">
            <h2>Contar interacciones</h2>
            <p>Conteo de interacciones</p>
            <button onclick="contarInteracciones()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Simulador de barra de carga</h2>
            <p>Barra de carga</p>
            <button onclick="simularBarra()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Calcular el descuento</h2>
            <p>Calculo del descuento final</p>
            <button onclick="calcularDescuento()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Calculo total de puntos</h2>
            <p>Calculo de puntos en un videojuego</p>
            <button onclick="calcularPuntos()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Contador de notificaciones</h2>
            <p>Contador de notificaciones pendientes</p>
            <button onclick="contadorNotificaciones()">Ejecutar</button>
        </div>

    </div>

    <script src="static/js/script.js"></script>

</body>

</html>
