<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Beatriz Dominguez">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="encabezado">
        <div class="titulo-encabezado">
            <h1>Perfil</h1>
        </div>
            <nav class="nav">
                <a href="#">Inicio</a>
                <a href="#">Mi perfil</a>
                <a href="#">Conexiones</a>
                <button class="boton-encabezado">Cerrar sesión</button>
            </nav>
            </header>
            <main class="contenedor-principal">
                <section class="caja-principal">
                <div class="targeta-principal">
                    <div class="superior-targeta"></div>
                        <div class="descripcion-targeta">
                                    <div class="icono-perfil">
                                        <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                    </div>
                            <div class="informacion-targeta">
                                <h2 class="separacion">Jane Doe</h2>
                                <p class="parrafo-gris">Bergen-Noruega</p>
                                <p class="separacion">Desarrolladora Frontend <span class="salto-linea">Conocimientos en HTML, CSS, JavaScript</span></p>
                                <a href="#" class="editar-perfil">⚙Editar perfil</a>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="caja-lateral">
                    <div class="targeta-conexiones">
                        <div class="row1">
                            <h3>Solicitudes de conexión</h3>
                            <button class="boton-conexiones">Ver todas</button>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Steve Jobs</p>
                            </div>
                            <div class="botones">
                                <p>✔</p>
                                <p>❌</p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Bill Gates</p>
                            </div>
                            <div class="botones">
                                <p>✔</p>
                                <p>❌</p>
                            </div>
                        </div>

                    </div>
                    <div class="targeta-conexiones">
                        <div class="row1">
                            <h3>Tus conexiones</h3>
                            <button class="boton-conexiones">Ver todas</button>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Richard Stallman</p>
                            </div>
                            <div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Linus Torvalds</p>
                            </div>
                            <div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Ada Lovelace</p>
                            </div>
                            <div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="contenedor-imagenes2">
                                <img src="static/images/icono-perfil1.png" alt="icono-perfil">
                                <p class="separacion-nombre">Grace Hopper</p>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
</body>
</html>
